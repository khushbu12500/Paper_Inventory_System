<!DOCTYPE html>
<html>
<head>
    <title>Edit Product</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="login-box">

    <h2>Edit Product</h2>

    <form method="POST">

        <label>Product Name</label><br>
        <input type="text"
               name="product_name"
               value="{{ product[1] }}"
               required><br><br>

       <label>Category <span class="required">*</span></label>

<select id="category" name="category" required>
    <option value="">Select Category</option>
    <option value="Paper" {% if product[2] == 'Paper' %}selected{% endif %}>Paper</option>
    <option value="Electronics" {% if product[2] == 'Electronics' %}selected{% endif %}>Electronics</option>
    <option value="Chemicals" {% if product[2] == 'Chemicals' %}selected{% endif %}>Chemicals</option>
    <option value="Pipes" {% if product[2] == 'Pipes' %}selected{% endif %}>Pipes</option>
    <option value="Containers" {% if product[2] == 'Containers' %}selected{% endif %}>Containers</option>
    <option value="Office Supplies" {% if product[2] == 'Office Supplies' %}selected{% endif %}>Office Supplies</option>
</select>

<br><br>

        <label>Specification <span class="required">*</span></label>

<select id="specification" name="specification" required>
    <option value=" ">select specification</option>
</select>

<br><br>

<label>Brand <span class="required">*</span></label>

<select id="brand" name="brand" required>
    <option value=" ">select brand</option>
</select>

<br><br>

        <label>Unit <span class="required">*</span></label>

<select name="unit" required>

<option value="{{ product[6] }}">{{ product[6] }}</option>

<option value="Piece">Piece</option>
<option value="Ream">Ream</option>
<option value="Sheet">Sheet</option>
<option value="Pack">Pack</option>
<option value="Box">Box</option>
<option value="Kg">Kg</option>
<option value="Litre">Litre</option>
<option value="Meter">Meter</option>
<option value="Drum">Drum</option>

</select>

<br><br>



        <label>Quantity</label><br>
<input type="number"
       id="quantity"
       name="quantity"
       value="{{ product[3] }}"
       required><br><br>

       <label>Price Per Unit</label><br>
<input type="number"
       id="price"
       name="price_per_unit"
       value="{{ product[4] }}"
       required><br><br>

       <label>Total Price</label><br>
<input type="number"
       id="total_price"
       name="total_price"
       value="{{ product[7] }}"
       readonly><br><br>

      <label>Supplier <span class="required">*</span></label>

<select id="supplier" name="supplier" required>

    <option value="">Select Supplier</option>

    {% for supplier in suppliers %}
        <option value="{{ supplier[2] }}">{{ supplier[2] }}</option>
    {% endfor %}

</select>

<br><br>
       


        <button type="submit">
            Update Product
        </button>

    </form>

</div>
<script>
document.addEventListener("DOMContentLoaded", function () {

    const productData = {
        "Paper": {
            specifications: ["White", "Blue", "Pink", "Yellow", "Green"],
            brands: ["JK Copier", "JK Easy Copier", "Century", "Xerox", "Navigation", "BILT Copier", "Chamex"]
        },

        "Electronics": {
            specifications: ["Laptop", "Keyboard", "Mouse", "Printer", "Scanner"],
            brands: ["HP", "Dell", "ASUS", "Lenovo", "Logitech", "Zebronics"]
        },

        "Chemicals": {
            specifications: ["Glue", "Ink", "Bleach", "Acid"],
            brands: ["BASF", "SABIC", "LG Chem", "Atul Ltd"]
        },

        "Pipes": {
            specifications: ["PVC", "GI", "CPVC", "HDPE"],
            brands: ["Ashirvad", "Finolex", "Astral"]
        },

        "Containers": {
            specifications: ["Plastic Drum", "Steel Drum", "Carton Box"],
            brands: ["Time Technoplast", "Sintex"]
        },

        "Office Supplies": {
            specifications: ["Pen", "Notebook", "File", "Stapler"],
            brands: ["Reynolds", "Classmate", "Solo"]
        }
    };


    const category = document.getElementById("category");
    const specification = document.getElementById("specification");
    const brand = document.getElementById("brand");

    const quantity = document.getElementById("quantity");
    const price = document.getElementById("price");
    const totalPrice = document.getElementById("total_price");


    function updateOptions() {

        const selectedCategory = category.value;

        specification.innerHTML =
            '<option value="">Select Specification</option>';

        brand.innerHTML =
            '<option value="">Select Brand</option>';


        if (productData[selectedCategory]) {

            productData[selectedCategory].specifications.forEach(function(item) {

                const option = document.createElement("option");

                option.value = item;
                option.textContent = item;

                specification.appendChild(option);
            });


            productData[selectedCategory].brands.forEach(function(item) {

                const option = document.createElement("option");

                option.value = item;
                option.textContent = item;

                brand.appendChild(option);
            });
        }
    }


    category.addEventListener("change", updateOptions);


    // Load Specification and Brand when page opens
    updateOptions();


    // Total Price
    function calculateTotal() {

        const qty = parseFloat(quantity.value) || 0;
        const priceValue = parseFloat(price.value) || 0;

        totalPrice.value = (qty * priceValue).toFixed(2);
    }


    quantity.addEventListener("input", calculateTotal);
    price.addEventListener("input", calculateTotal);

    calculateTotal();

});
</script>
</body>
</html>
